<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tecidos KiBarato. Nosso site está em construção. Em breve, novidades para você!">
    <title>Tecidos KiBarato | Página em construção</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: #faf7f2;
            color: #302b28;
            font-family: system-ui, sans-serif;
            text-align: center;
        }
        main {
            flex: 1;
            display: grid;
            place-content: center;
            padding: 3rem 1.5rem;
        }
        .brand {
            margin: 0 0 2rem;
            color: #8a3b32;
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -.04em;
        }
        .brand::after {
            content: "";
            display: block;
            width: 4rem;
            margin: 1.5rem auto 0;
            border-bottom: 2px dashed #b77b60;
        }
        h1 { margin: 0 0 1rem; font-size: clamp(1.4rem, 5vw, 2rem); }
        .message {
            max-width: 32rem;
            margin: 0 auto;
            color: #665b53;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        footer { padding: 1.5rem; color: #665b53; font-size: .85rem; }
    </style>
</head>
<body>
    <main>
        <p class="brand">Tecidos KiBarato</p>
        <h1>Página em construção</h1>
        <p class="message">Estamos preparando nosso site com carinho.<br>Em breve, novidades para você!</p>
    </main>
    <footer>&copy; {% now "Y" %} Tecidos KiBarato. Todos os direitos reservados.</footer>
</body>
</html>
